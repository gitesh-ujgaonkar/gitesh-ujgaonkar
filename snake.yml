# Place this file at: .github/workflows/snake.yml in your profile repo
# (GitHub's "Create new file" box lets you type that whole path as the filename)

name: generate profile snake animation

on:
  schedule:
    - cron: "0 */6 * * *"    # regenerate every 6 hours
  workflow_dispatch: {}       # adds a manual "Run workflow" button under the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
